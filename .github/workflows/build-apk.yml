name: Build APK

# 云端构建：推送代码或手动触发后，在 GitHub Actions 里编译出 debug APK。
# 本地沙箱若因网络/守护进程问题编不出 APK，就走这条路。
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # gradle-wrapper.jar 是二进制文件，未随代码入库；在 CI 里从 Gradle 官方仓库取回。
      - name: Fetch Gradle wrapper jar
        run: curl -L -o gradle/wrapper/gradle-wrapper.jar https://github.com/gradle/gradle/raw/v8.7.0/gradle/wrapper/gradle-wrapper.jar

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: video-downloader-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

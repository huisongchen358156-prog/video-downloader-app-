name: Build APK

# 云端构建：推送代码或手动触发后，在 GitHub Actions 里编译出 debug APK。
# 本地沙箱若因网络/守护进程问题编不出 APK，就走这条路。
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 注意：不要用 android-actions/setup-android@v3，它会让 sdkmanager
      # 装已废弃的 `tools` 包（Failed to find package 'tools'，exit 1）。
      # GitHub 托管的 ubuntu-latest 自带 Android SDK（ANDROID_HOME 已设置），
      # Gradle 直接用它就能编。
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: video-downloader-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
